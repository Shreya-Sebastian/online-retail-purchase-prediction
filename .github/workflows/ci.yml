name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4  # local Spark for the tests
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: pytest -q
