# Databricks Asset Bundle: deploys the notebooks and package and defines the pipeline as one job.
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run custprop_pipeline
# The tasks run on serverless compute, so no cluster is defined.

bundle:
  name: custprop

variables:
  catalog:
    default: workspace
  schema:
    default: custprop

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://YOUR-WORKSPACE.cloud.databricks.com  # replace with your workspace URL
  azure:
    # Azure Databricks (see docs/azure.md): pass the workspace's catalog with --var catalog=<name>
    mode: development
    workspace:
      host: https://adb-XXXXXXXXXXXXXXXX.X.azuredatabricks.net  # replace with your workspace URL

resources:
  jobs:
    custprop_pipeline:
      name: custprop-pipeline
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./notebooks/01_ingest.py
        - task_key: snapshots
          depends_on: [{task_key: ingest}]
          notebook_task:
            notebook_path: ./notebooks/02_snapshots.py
        - task_key: segments
          depends_on: [{task_key: snapshots}]
          notebook_task:
            notebook_path: ./notebooks/03_segments.py
        - task_key: propensity
          depends_on: [{task_key: segments}]
          notebook_task:
            notebook_path: ./notebooks/04_propensity.py
        - task_key: recommend
          depends_on: [{task_key: segments}]
          notebook_task:
            notebook_path: ./notebooks/05_recommend.py
        - task_key: score
          depends_on: [{task_key: propensity}]
          notebook_task:
            notebook_path: ./notebooks/06_score.py
        - task_key: figures
          depends_on: [{task_key: segments}]
          notebook_task:
            notebook_path: ./notebooks/07_figures.py
      # weekly refresh; paused so nothing runs until you switch it on
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: Europe/Amsterdam
        pause_status: PAUSED

    # scoring on its own, with whatever version is "champion", without retraining
    custprop_scoring:
      name: custprop-scoring
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: score
          notebook_task:
            notebook_path: ./notebooks/06_score.py
      # first day of the month; paused like the pipeline
      schedule:
        quartz_cron_expression: "0 0 7 1 * ?"
        timezone_id: Europe/Amsterdam
        pause_status: PAUSED
