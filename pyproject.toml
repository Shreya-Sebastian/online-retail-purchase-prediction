[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custprop"
version = "0.1.0"
description = "Customer segmentation and purchase prediction on Databricks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3",  # PySpark 3.5 and Databricks runtimes use pandas 2
    "scikit-learn>=1.4",
    "pyarrow>=14",
]

[project.optional-dependencies]
local = ["pyspark>=3.5,<4.1", "openpyxl>=3.1"]  # Databricks provides Spark itself
dev = ["pytest>=8", "pyspark>=3.5,<4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
